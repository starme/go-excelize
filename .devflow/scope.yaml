# .devflow/scope.yaml
# v2 项实施 feature：P2-3 ImportStream 流式导入（P2-4 ImportOf 已在 GATE_ARCH 用户裁决放弃）
# 本文件由架构 Agent 覆盖生成（原 scope.yaml 属上一轮 P2-1+P2-2，已整体替换）
# 技术方案见 docs/architecture-v2-import-stream-generics.md

work_type: feature
tracks:
  - backend

affected:
  backend:
    files:
      - path: importer.go
        reason: "P2-3 ImportStream 落点（新增 ImportStream 方法，复用 sheetNameFor/importSingle/imp 的 header+skip 前缀）。不改 Import/ImportConcurrent/sheetNameFor/importSingle/imp 既有函数体"
      - path: scanner.go
        reason: "R1 复用红线：从 scanSlice 循环体抽出共享内核 fillOne（reader headerIdx+row+dst → fillStruct），scanSlice 与新增 scanStream 共调；新增 scanStream（file.Rows 迭代逐行）。scanSlice 既有逻辑逐字保留，仅把 383-394 循环体抽成 fillOne 调用，语义零变化"
      - path: reader.go
        reason: "新增 reader.rows(name) (string, error) 返回 file.Rows 迭代器（不开新逻辑，复用 GetHeader 已用的 file.Rows() 流式基础设施）；如需流式 skip 需在 Rows 上循环跳过前 skip 行（复用 GetHeader 74-86 的 skip 语义）。不改 GetHeader/GetRows 既有函数体"
    new_files:
      - path: stream_test.go
        reason: "P2-3 新增测试：AC-1 等价（TestImportStream_EquivalentToImport 含 relation）、AC-2 skip、AC-3 break 释放、开放点2 多 sheet 报错、开放点3 不触发 Collection"

contract_changes: false     # 纯增量：零既有导出符号改动；允许新增导出符号 ImportStream（本轮任务本身）
contract_files: []
risk_level: medium           # 涉及流式资源释放，但共享内核守护双实现漂移
parallelizable: false        # T1 基线锁定先行 → T2 ImportStream → T3 readme+benchmark，串行

dependency_order:
  - backend

tasks:
  # ─────────────────────────────────────────────────────────────
  # T1 基线锁定（TDD 红基线 + 峰值数字锚点）
  # ─────────────────────────────────────────────────────────────
  - id: tdd-baseline
    title: "基线锁定：确认 31 既有测试全绿 + 复现 BenchmarkImport 1e5 行 1.73GB 峰值 + ImportStream 未实现（编译失败=红）"
    track: backend
    description: >
      跑 go test ./... 确认 31 既有测试全绿；跑 BenchmarkImport 1e5 行确认 B/op 1.73GB
      基线可复现（AC-4 对比锚点）；写 stream_test.go 中引用未实现的
      ImportStream 符号，编译失败=红基线。此 task 不写实现。
    must_read:
      - docs/architecture-v2-import-stream-generics.md   # §2 实现设计 + §1 开放点结论
      - docs/prd-v2-import-stream-generics.md            # §3 API 形态 + §5 AC-1~4/7/8
      - benchmark_test.go                                # benBuildXlsx 夹具 + BenchmarkImport 结构与规模
    pattern_ref:
      - "ImportStream(e Excel) iter.Seq2[interface{}, error] 未定义 → 引用的测试编译失败"
      - "go test -run '^$' -bench BenchmarkImport -benchtime=1x 复现峰值"
    gotcha:
      - "只锁定基线，不改任何 .go 业务源码；新增测试文件可先写测试函数体引用未实现符号"
      - "峰值度量统一 runtime.ReadMemStats().HeapAlloc（不用 B/op，见架构 §开放点5）"
    tests:
      - "go test ./... 全绿（31 既有测试，本轮尚未新增实现）"
      - "BenchmarkImport 1e5 行峰值 ≈ 1.73GB 量级可复现"
    validate:
      - go test ./...
      - go test -run '^$' -bench 'BenchmarkImport$' -benchtime=1x

  # ─────────────────────────────────────────────────────────────
  # T2 P2-3 ImportStream（AC-1~4 测试先行）
  # ─────────────────────────────────────────────────────────────
  - id: import-stream
    title: "P2-3 ImportStream 流式导入（iter.Seq2 逐行 yield + defer 释放 + 共享内核 fillOne/scanStream）"
    track: backend
    description: >
      按架构 §2 实现：scanner.go 抽共享内核 fillOne（scanner.go:383-394 循环体抽出，scanSlice 与
      scanStream 共调）；新增 scanner.scanStream（file.Rows 迭代逐行 fillOne）；reader.go 新增
      rows(name) 返回 file.Rows 迭代器 + 流式 skip（复用 GetHeader 74-86 语义）；importer.go 新增
      ImportStream 方法（复用 sheetNameFor/resolveSheetName/imp 的 header+skip 前缀，type switch 命中
      WithMultipleSheets 返回整体错误，生成器函数内 defer 释放 rows.Close+reader.close）。
      资源释放用 iter.Seq2 生成器内 defer（实测：range 提前 break 时 yield 返回 false → 生成器 return
      → defer 确定性执行）。不触发 Collection。TDD：AC-1 等价 + AC-2 skip + AC-3 break 释放 + 多 sheet
      报错先行，实现后绿。
    must_read:
      - docs/architecture-v2-import-stream-generics.md   # §2.1 共享内核 + §2.2 ImportStream 落点 + §1 开放点1/2/3
      - docs/prd-v2-import-stream-generics.md            # §3.1 形态 + AC-1~4
      - importer.go                                      # Import(41-74)/sheetNameFor(78-85)/importSingle(88-95)/imp(157-190)
      - reader.go                                        # GetHeader(58-87) 已用 file.Rows() 流式 + skip 语义
      - scanner.go                                       # scanSlice(362-397) 循环体 → 抽 fillOne
    pattern_ref:
      - "func (s *scanner) fillOne(headerIdx map[string]int, row []string, dst reflect.Value) error { return s.fieldMapper.fillStruct(row, headerIdx, dst, s.handleRelation) }"
      - "func (i Importer) ImportStream(e Excel) iter.Seq2[interface{}, error]；生成器内 defer rows.Close()+reader.close()"
      - "for rows.Next() { row,_ := rows.Columns(); yield 逐行 fillOne 结果；fillOne err → yield(nil,err)+return }"
      - "type switch：case WithMultipleSheets → yield(nil, errors.New('multi sheet use Import'))；default → 单 sheet"
    gotcha:
      - "scanSlice 既有循环体逐字保留语义，仅抽成 fillOne 调用；fillStruct/parseCached/handleRelation/RelationResolver 一行不改（R1 红线）"
      - "yield 的 V 是 *T struct 指针（interface{}），调用方需 row.(*MyRow)；readme 示例必须说明"
      - "defer 释放在生成器函数内，覆盖 break/耗尽/panic 三路径；不引入显式 Close、不用 runtime.AddCleanup"
      - "流式 header 复用 GetHeader（含 skip）；数据用独立 file.Rows() 迭代器，跳过首行（表头行）"
      - "WithHeading 校验 + withSkip 在开生成器前完成（复用 imp 前缀）；skip 在 Rows 迭代上手跳过"
      - "不触发 Collection（开放点3）"
    tests:
      - "AC-1：TestImportStream_EquivalentToImport，含 relation 字段 reflect.DeepEqual"
      - "AC-2：TestImportStream_Skip，首行与全量 skip 一致"
      - "AC-3：TestImportStream_BreakReleasesResource，break 后句柄不增长（重复 OpenFile 成功 + 句柄计数）"
      - "开放点2：TestImportStream_MultiSheetErrors 整体错误"
      - "开放点3：TestImportStream_NoCollection 不触发"
      - "既有 31 测试全过，scanSlice 全量路径零回归"
    validate:
      - go test ./...
      - go test ./... -race
      - go vet ./...
      - gofmt -l .

  # ─────────────────────────────────────────────────────────────
  # T3 readme 文档化 + BenchmarkImportStream 内存对比（原 T4；P2-4 ImportOf 已放弃，T3 import-of 删除）
  # ─────────────────────────────────────────────────────────────
  - id: readme-bench
    title: "readme 文档化 ImportStream + 新增 BenchmarkImportStream + AC-4 内存对比表"
    track: backend
    description: >
      新增 BenchmarkImportStream（复用 benBuildXlsx 夹具 1e2/1e4/1e5，用 runtime.ReadMemStats 峰值，
      不用 B/op，与 BenchmarkImport 1.73GB 基线形成 AC-4 对比表）。readme 新增 ImportStream 节
      （iter.Seq 用法 + 提前 break 释放说明 + row.(*MyRow) 断言示例）。示例与实现一致可编译。
    must_read:
      - docs/architecture-v2-import-stream-generics.md   # §2.5 benchmark + §3 readme 需写明的偏差
      - docs/prd-v2-import-stream-generics.md            # AC-4/AC-8
      - benchmark_test.go                                # benBuildXlsx/benRowValue 夹具复用
      - readme.md                                        # 现有示例风格
      - importer.go                                      # ImportStream 真实签名（保证示例一致）
    pattern_ref:
      - "BenchmarkImportStream：for row, err := range importer.ImportStream(&e) { _,_ = row,err } 累计解析"
      - "b.ReportMetric 记录 ReadMemStats().HeapAlloc 峰值；对比表列 ns/op/B/op(参考)/allocs/峰值MB"
      - "readme ImportStream 节：for row, err := range importer.ImportStream(e) 示例 + row.(*MyRow) 断言"
    gotcha:
      - "示例必须用真实签名 ImportStream(e Excel) iter.Seq2[interface{},error]，无 readme/实现漂移"
      - "峰值度量用 ReadMemStats 非 B/op（架构 §开放点5）；对比表口径写明"
      - "readme 必须写明偏差：row.(*MyRow) 断言；Collection 不触发；多 sheet 报错用 Import"
      - "不新增第三方依赖、不改 xlsx: 标签、不碰 test/ 夹具、不改 go.mod"
    tests:
      - "BenchmarkImportStream 1e2/1e4/1e5 三档产出，峰值 vs 1.73GB 对比表落入架构 §开放点5 两档门槛（无 relation ≤10%）"
      - "readme 示例可编译（Example* 测试或 go build 静态检查）"
    validate:
      - go test ./...
      - go test -run '^$' -bench 'BenchmarkImportStream$' -benchtime=3x -count=1
      - go vet ./...
      - gofmt -l .

dispatch:
  - agent: devflow-backend-dev
    task_ids:
      - tdd-baseline
      - import-stream
      - readme-bench
    boundary:
      allowed_files:
        - importer.go           # 仅新增 ImportStream 方法，不改既有函数体
        - reader.go             # 仅新增 rows(name) 迭代器 + 流式 skip，不改 GetHeader/GetRows
        - scanner.go            # 仅抽 fillOne 共享内核 + 新增 scanStream，scanSlice 循环体语义保零变化
        - readme.md             # 文档化 ImportStream（含偏差说明）
      allow_new_test_files: true
        # 新增 stream_test.go（新函数，不得改既有测试函数）
      forbidden_files:
        - column.go             # parse/parseTag/parseCached 冻结契约，严禁动
        - errors.go             # 本轮复用 InvalidUnmarshalError，不改定义
        - excel.go              # 接口集冻结（Excel/Sheet/WithXxx 签名），严禁动
        - exporter.go           # 导出侧，本轮无关
        - go.mod
        - go.sum
        - test/**               # 夹具 xxx.xlsx 等，严禁删改
        - v1/**
      forbidden_actions:
        - "不得修改、删除、改名任何已导出符号（Import/ImportConcurrent/Close/NewImporter*/Excel/Sheet/WithXxx 等）"
        - "不得修改既有测试函数（只可新增 *_test.go 增补新函数）"
        - "不得新增第三方依赖（当前仅 spf13/cast 与 xuri/excelize/v2）"
        - "不得修改 xlsx: 标签解析语义与中文列名文案（column.go 冻结）"
        - "不得改 scanSlice/fillStruct/parse/parseCached/RelationResolver 的既有语义（R1 复用红线，只抽共享内核不重写）"
        - "不得在 ImportStream 触发 Collection 或改 Import 的 Collection 语义"
        - "不得改 go.mod 版本（go 1.23.3 已满足 iter 包）"

memorant_recall_query: >
  go-excelize Import ImportStream iter Seq2 流式导入 逐行 yield 内存峰值 O(N) O(字段)
  R1 复用 fillStruct parseCached RelationResolver getChildData cache 子表预加载 relation 语义
  defer 释放 句柄泄漏 门槛设定 机制上限 峰值 ReadMemStats B/op 累计 量级下降
  parse 递归 嵌套 struct 跳过复合字段

methodology:
  tdd: "新 API 行为级测试先行（AC-1 等价/AC-2 skip/AC-3 break 释放，未实现符号编译失败=红）；共享内核抽完 scanSlice 全量路径零回归"
  compatibility: "纯增量：现有 API 签名/行为零变化，现有 31 测试零改动全过，xlsx: 标签冻结，go.mod 不升版本"
  r1_reuse: "流式复用解析链路只换数据源（GetRows→Rows 迭代器），fillStruct/parseCached/RelationResolver 只此一份，双实现漂移=验收失败"
  release_mechanism: "iter.Seq2 生成器内 defer 释放（实测 yield=false→return→defer 确定性执行），不用显式 Close/runtime.AddCleanup"
  memory_threshold: "门槛 ≤ 机制上限 × 0.8；无 relation ≤ 全量 10%（~173MB 峰值），含 relation ≤ Relation 基线 30%（~113MB）；度量用 ReadMemStats 峰值非 B/op"
  validate: "go test ./... + go test ./... -race + go vet ./... + gofmt -l . + benchmark 命令"
