# .devflow/scope.yaml
# 第二轮优化实施 feature：P0-4 字段元数据缓存 + P1×5 代码质量清理
# 本文件由架构 Agent 覆盖生成（原 scope.yaml 属上一轮 bugfix task，已整体替换）
# 技术方案见 docs/architecture-optimization-implementation.md

work_type: feature
tracks:
  - backend

affected:
  backend:
    files:
      - path: scanner.go
        reason: "P0-4 落点：fillStruct(117) parse→parseCached、内层 header 线性查找(125-131)改 header→index 映射；包级 sync.Map 字段缓存"
      - path: importer.go
        reason: "P1-2 落点：Import/ImportConcurrent default 分支与 sheet 名解析抽 importSingle/sheetNameFor；P1-1 波及点：Import/ImportConcurrent 的 defer Close 合并 closeErr"
      - path: reader.go
        reason: "P1-1 落点：close(89-94) 改返回 error，与 GetHeader 标准 closeErr 合并模式对齐"
      - path: errors.go
        reason: "P1-3 落点：ExcelLineError/LinesError 加 Deprecated 标注；删 Line 字段+注释代码；InvalidUnmarshalError.Error 前缀修正"
      - path: column.go
        reason: "P1-4 落点：删 field.encoding 死字段(24)与 parse 注释掉的旧 map 实现(49-51/63)"
      - path: exporter.go
        reason: "P1-5 波及点：setColWidth(82-85) sqref 展开改用 expandSqref helper"
      - path: dataValidate.go
        reason: "P1-5 落点：FormatDataValidate(85-89) 抽出 expandSqref，两处共用"
      - path: readme.md
        reason: "可选：若 P1-3 修正错误前缀/删除死字段影响到 readme 使用方法说明，则同步（PRD §5 第 18 条 P2）"
    new_files:
      - path: scanner_test.go
        reason: "P0-4 新增：缓存隔离（不同类型不串扰）+ 缓存透明（同类型重复导入一致）+ 并发正确性（-race）测试。注意：scanner_test.go 已存在，为『增补新测试函数』，不得改既有函数"

contract_changes: false     # 零导出 API 变化、xlsx: 标签冻结，唯一例外 InvalidUnmarshalError 错误文本（PRD §4.2 豁免）
contract_files: []
risk_level: medium           # P0-4 缓存动导入热路径，需并发正确性测试兜底；P1×5 纯重构有 17 测试安全网
parallelizable: false        # P0-4 与 P1-2 都动 scanner/importer，P0-4 与 P1-4 都动 column.go field 结构体，串行

dependency_order:
  - backend

tasks:
  # ─────────────────────────────────────────────────────────────
  # M1 行为锁定（所有后续任务的前置）：先确认 17 测试绿 + 落 benchmark before
  # ─────────────────────────────────────────────────────────────
  - id: opt-m1-baseline-lock
    title: "M1 行为锁定：17 测试全绿确认 + benchmark before 数据落盘"
    track: backend
    description: >
      跑 go test ./... 确认现有 17 个测试全绿作为重构安全网基线；跑 benchmark
      记录 before 三项（FillStruct / Import / 其余回退约束项）数据，供 M4 对比。
      不改任何源码，纯验证与记录。
    must_read:
      - docs/architecture-optimization-implementation.md
      - docs/prd-optimization-implementation.md
      - benchmark_test.go
    pattern_ref:
      - "go test ./..."                    # 17 测试绿基线
      - "go test ./... -race"              # 现有测试 -race 基线
      - "go vet ./..."                     # vet 干净基线
      - "go test -run '^$' -bench 'Benchmark(FillStruct|Import|ImportConcurrent|ScanSlice|Relation)$' -benchtime=1s -count=3 -benchmem ./..."
    gotcha:
      - "baseline 数据须标注 Go 版本 go1.26.4（本机）vs go.mod 1.23.3；M4 after 同版本采集"
      - "夹具在 b.ResetTimer() 前（现有 benchmark_test.go 已满足，勿改动）"
      - "只记录不修改，任何测试失败都先回报，不进入后续 task"
    tests:
      - "go test ./...（须 17 全绿）"
      - "go vet ./...（须干净）"
    validate:
      - go test ./...
      - go vet ./...

  # ─────────────────────────────────────────────────────────────
  # M2 P0-4 缓存实现（TDD：并发正确性测试先行，红 → 实现 → 绿）
  # ─────────────────────────────────────────────────────────────
  - id: opt-p0-4-field-cache
    title: "P0-4 字段元数据缓存 + header→index 索引 + 并发安全"
    track: backend
    description: >
      按 reflect.Type 包级缓存 parse 结果（[]field，sync.Map），消除每行重复 parse 反射；
      scanSlice 层构建 header→index 映射（map[string]int，首个写定保留『第一个匹配』语义），
      内层线性查找改 O(1)。TDD：先写并发正确性测试（-race）确认失败，再实现。
      缓存生命周期见架构文档 §2.1（字段缓存全局 / header 索引 per-sheet）。缓存值结构 §2.2
      （[]field 直存，复用原 parse 而非另写 parseType，§2.4 第 4 条）。
    must_read:
      - docs/architecture-optimization-implementation.md      # §2 缓存架构 + §2.5 门槛
      - scanner.go                                            # fillStruct(117)/scanSlice(360) 现有逻辑
      - column.go                                             # parse(37)/field(20) 解析规则
      - importer.go                                           # ImportConcurrent(85) 并发路径
    pattern_ref:
      - "包级 var fieldCache sync.Map；LoadOrStore 首次写、Load 后续读"
      - "parseCached(t reflect.Type) 构造 reflect.New(t).Elem() 复用原 parse(v)"
      - "scanSlice 构建 headerIdx := map[string]int，首个写定保留 break 语义"
      - "并发测试用 goroutine + sync.WaitGroup 对同一 fieldCache 并发 FillStruct，-race 跑"
    gotcha:
      - "缓存必须包级，禁放 FieldMapper 实例字段（newScanner 每 sheet 新建实例，缓存会失效）——架构 §1.4"
      - "header→index 首个写定，避免 map 后写覆盖破坏原『第一个匹配』语义——架构 §2.4 第 3 条"
      - "复用原 parse 而非另写 parseType，避免双实现语义漂移——架构 §2.4 第 4 条"
      - "不改 applyFieldRule 的 FieldByName 反射（本轮范围仅 parse + header 查找）"
    tests:
      - "新增并发正确性测试（多 goroutine 共用 fieldCache，-race 通过）——PRD §5 第 4 条"
      - "新增缓存隔离测试（SelectColumnRow vs TextColumnRow 互不串扰）——§5 第 5 条"
      - "新增缓存透明测试（同类型多次导入结果一致）——§5 第 6 条"
      - "现有 17 测试继续全绿（含 -race）"
    validate:
      - go test ./...
      - go test ./... -race
      - go vet ./...

  # ─────────────────────────────────────────────────────────────
  # M3 P1×5 代码质量清理（纯重构，17 测试为安全网）
  # ─────────────────────────────────────────────────────────────
  - id: opt-p1-code-quality
    title: "P1-1~P1-5 代码质量清理（吞错修正/重复抽取/死类型标注/死字段删除/sqref 抽取）"
    track: backend
    description: >
      P1-1 reader.close 改返回 error，Import/ImportConcurrent 合并 closeErr（路径 B，架构 §3.1）；
      P1-2 抽 importSingle/sheetNameFor（架构 §3.2，闭包捕获注意）；
      P1-3 ExcelLineError/LinesError 加 Deprecated 标注 + 删 Line 字段/注释代码 + InvalidUnmarshalError 前缀修正（架构 §3.3）；
      P1-4 删 field.encoding 与注释代码；P1-5 抽 expandSqref。全部以现有 17 测试为安全网。
    must_read:
      - docs/architecture-optimization-implementation.md      # §3 P1×5 实现要点
      - reader.go                                             # close(89) 与 GetHeader closeErr 模式(68-72)
      - importer.go                                           # Import(41)/ImportConcurrent(85) 重复分支
      - errors.go                                             # ExcelLineError(105)/LinesError(115)/InvalidUnmarshalError(12)
      - column.go                                             # field.encoding(24)/注释块(49-51,63)
      - exporter.go / dataValidate.go                         # sqref 展开两处(82-85/85-89)
    pattern_ref:
      - "reader.close() error 返回；Import 具名返回值 + defer 闭包合并 closeErr（err==nil 时覆盖）"
      - "sheetNameFor 返回 (name, explicit)；importSingle 复用；goroutine 已显式传参保持"
      - "Deprecated 注释英文：'// Deprecated: this type has no remaining trigger point...'"
      - "expandSqref(ref string) (from, to string)；两处调用点拼回各自尾随语义"
    gotcha:
      - "P1-1 签名红线：Importer.Close() 签名不变（无返回），只改未导出 reader.close"
      - "P1-3 删 ExcelLineError.Line 前 grep 全库确认无引用（架构 §3.3）"
      - "P1-2 goroutine 闭包不引入 name/n 循环变量捕获竞态"
      - "InvalidUnmarshalError 只改前缀不改分支逻辑（架构 §3.3）"
    tests:
      - "现有 17 测试全绿（含 -race）作为重构安全网——PRD §5 第 12-15 条"
    validate:
      - go test ./...
      - go test ./... -race
      - go vet ./...

  # ─────────────────────────────────────────────────────────────
  # M4 benchmark 对比（after 采集 + 对比表 + 门槛判定）
  # ─────────────────────────────────────────────────────────────
  - id: opt-m4-benchmark
    title: "M4 benchmark 对比：采集 after 数据 + 产出对比表 + 门槛判定"
    track: backend
    description: >
      用与 M1 相同命令与 Go 版本（go1.26.4）采集 after 数据，3 档 × count=3 取中位数，
      产出 before/after 对比表并判定 P0-4 达标门槛：
      BenchmarkFillStruct 提速 ≥60% 且 allocs/op ≤10 行均摊；
      BenchmarkImport 提速 ≥8% 且 allocs/op 不升；
      ImportConcurrent/ScanSlice/FillStruct/Relation 无回退。
    must_read:
      - docs/architecture-optimization-implementation.md      # §2.5 门槛数值与规范
      - docs/optimization-analysis.md                         # §3.1 基线数据
    pattern_ref:
      - "go test -run '^$' -bench 'Benchmark(FillStruct|Import|ImportConcurrent|ScanSlice|Relation)$' -benchtime=1s -count=3 -benchmem ./..."
    gotcha:
      - "after 与 M1 before 必须同版本（go1.26.4）同参数采集，否则不具可比性"
      - "对比表标注 Go 1.26.4 采集 vs go.mod 1.23.3"
      - "门槛判定给明确 PASS/FAIL，不达标回报，不静默通过"
    tests:
      - "benchmark 对比表（3 档 × 中位数）+ 门槛判定"
    validate:
      - go test ./...
      - go vet ./...

dispatch:
  - agent: devflow-backend-dev
    task_ids:
      - opt-m1-baseline-lock
      - opt-p0-4-field-cache
      - opt-p1-code-quality
      - opt-m4-benchmark
    boundary:
      allowed_files:
        - scanner.go
        - importer.go
        - reader.go
        - errors.go
        - column.go
        - exporter.go
        - dataValidate.go
        - readme.md            # 可选，仅 P1-3 附带说明同步（PRD §5 第 18 条）
      allow_new_test_files: true
        # 新增 *_test.go（scanner_test.go 增补缓存测试函数、必要时新增并发测试文件）
      forbidden_files:
        - go.mod
        - go.sum
        - test/**               # 夹具 xxx.xlsx 等，严禁删改
        - v1/**
      forbidden_actions:
        - "不得修改既有测试函数（只可新增 *_test.go 增补新函数）"
        - "不得新增第三方依赖"
        - "不得修改任何已导出 API 签名"
        - "不得修改 xlsx: 标签解析语义与中文列名文案"

memorant_recall_query: >
  go-excelize parse 反射缓存 reflect.Type sync.Map header 索引 并发安全 field 元数据
  benchmark FillStruct allocs 优化 死类型 Deprecated close 吞错

methodology:
  tdd: "P0-4 并发正确性测试先行（-race 先红后绿）；P1×5 以 17 测试为安全网先锁行为再重构"
  benchmark: "3 档 × count=3 中位数，夹具 ResetTimer 前，标注 Go 1.26.4 vs go.mod 1.23.3"
  validate: "go test ./... + go vet ./...；P0-4 task 加 -race；M4 加 benchmark 命令与门槛判定"
